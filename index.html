<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📁 目录索引</title>
    <style>
        /* ===== CSS Variables (Light & Dark) ===== */
        :root {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --bg-hover: #f3f4f6;
            --bg-header: #ffffff;
            --bg-list-header: #f8fafc;
            --bg-item-hover: #f8fafc;
            --bg-input: #f9fafb;
            --bg-input-focus: #ffffff;

            --text-primary: #1f2937;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --text-light: #9ca3af;
            --text-white: #ffffff;

            --border-color: #d1d5db;
            --border-light: #e5e7eb;
            --border-focus: #2563eb;

            --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-card-hover: 0 4px 20px rgba(0, 0, 0, 0.08);

            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-primary-bg: #dbeafe;
            --color-primary-border: #93c5fd;

            --color-success: #22c55e;
            --color-danger: #dc2626;

            --code-bg: #f3f4f6;
        }

        body.dark {
            --bg-body: #0d1117;
            --bg-card: #161b22;
            --bg-hover: #1c2333;
            --bg-header: #161b22;
            --bg-list-header: #1c2333;
            --bg-item-hover: #1c2333;
            --bg-input: #0d1117;
            --bg-input-focus: #161b22;

            --text-primary: #e6edf3;
            --text-secondary: #c9d1d9;
            --text-muted: #8b949e;
            --text-light: #6e7681;
            --text-white: #f0f6fc;

            --border-color: #30363d;
            --border-light: #21262d;
            --border-focus: #58a6ff;

            --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.4);
            --shadow-card-hover: 0 4px 20px rgba(0, 0, 0, 0.6);

            --color-primary: #58a6ff;
            --color-primary-hover: #79c0ff;
            --color-primary-bg: #1f2937;
            --color-primary-border: #30363d;

            --color-success: #3fb950;
            --color-danger: #f85149;

            --code-bg: #2d333b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            transition: background 0.25s, color 0.25s;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        .header {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow-card);
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: box-shadow 0.2s, background 0.25s;
        }

        .header:hover {
            box-shadow: var(--shadow-card-hover);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .header-left .repo-icon {
            font-size: 1.6rem;
            line-height: 1;
        }

        .header-left .repo-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            background: var(--bg-hover);
            padding: 0.2rem 0.8rem;
            border-radius: 8px;
            white-space: nowrap;
            transition: background 0.25s, color 0.25s;
        }

        .header-left .repo-name a {
            color: inherit;
            text-decoration: none;
        }

        .header-left .repo-name a:hover {
            color: var(--color-primary);
        }

        .header-left .path-breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.95rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .header-left .path-breadcrumb .sep {
            color: var(--text-light);
            user-select: none;
        }

        .header-left .path-breadcrumb .crumb {
            cursor: pointer;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            transition: background 0.15s, color 0.15s;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .header-left .path-breadcrumb .crumb:hover {
            background: var(--bg-hover);
            color: var(--color-primary);
        }

        .header-left .path-breadcrumb .crumb.current {
            color: var(--text-primary);
            font-weight: 600;
            cursor: default;
        }

        .header-left .path-breadcrumb .crumb.current:hover {
            background: transparent;
            color: var(--text-primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .header-right .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            user-select: none;
            white-space: nowrap;
        }

        .header-right .btn:hover {
            background: var(--bg-hover);
            border-color: var(--text-light);
        }

        .header-right .btn-primary {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: var(--text-white);
        }

        .header-right .btn-primary:hover {
            background: var(--color-primary-hover);
            border-color: var(--color-primary-hover);
        }

        .header-right .btn .spinner-small {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .header-right .token-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-hover);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            transition: background 0.25s, color 0.25s;
        }

        .header-right .token-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .header-right .token-indicator .dot.on {
            background: var(--color-success);
        }

        .header-right .token-indicator .dot.off {
            background: var(--text-light);
        }

        .config-panel {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow-card);
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
            display: none;
            animation: fadeIn 0.25s ease;
            transition: background 0.25s, box-shadow 0.25s;
        }

        .config-panel.visible {
            display: block;
        }

        .config-panel h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .config-panel .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
        }

        .config-panel .form-row label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .config-panel .form-row input[type="text"],
        .config-panel .form-row input[type="password"] {
            padding: 0.45rem 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: border-color 0.15s, box-shadow 0.15s, background 0.25s, color 0.25s;
            flex: 1 1 160px;
            min-width: 120px;
            outline: none;
        }

        .config-panel .form-row input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            background: var(--bg-input-focus);
        }

        .config-panel .form-row .btn {
            padding: 0.45rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .config-panel .form-row .btn-primary {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: var(--text-white);
        }

        .config-panel .form-row .btn-primary:hover {
            background: var(--color-primary-hover);
            border-color: var(--color-primary-hover);
        }

        .config-panel .form-row .btn-secondary {
            background: var(--bg-hover);
            border-color: var(--border-color);
        }

        .config-panel .form-row .btn-secondary:hover {
            background: var(--bg-item-hover);
        }

        .config-panel .hint {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 0.6rem;
        }

        .config-panel .hint a {
            color: var(--color-primary);
        }

        .content {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: box-shadow 0.2s, background 0.25s;
            min-height: 320px;
        }

        .content:hover {
            box-shadow: var(--shadow-card-hover);
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            gap: 1.2rem;
        }

        .loading-state .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid var(--border-light);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-state .text {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .loading-state .text strong {
            color: var(--text-primary);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            gap: 0.8rem;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 3.2rem;
            opacity: 0.6;
        }

        .empty-state .title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .empty-state .desc {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
            gap: 0.8rem;
            color: var(--text-muted);
        }

        .error-state .icon {
            font-size: 2.8rem;
        }

        .error-state .title {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--color-danger);
        }

        .error-state .desc {
            font-size: 0.9rem;
            color: var(--text-light);
            text-align: center;
            max-width: 440px;
            word-break: break-word;
        }

        .error-state .btn {
            margin-top: 0.5rem;
            padding: 0.45rem 1.4rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .error-state .btn:hover {
            background: var(--bg-hover);
        }

        .file-list {
            display: flex;
            flex-direction: column;
        }

        .file-list .list-header {
            display: grid;
            grid-template-columns: 3fr 1.2fr 1.4fr 0.6fr;
            padding: 0.6rem 1.5rem;
            background: var(--bg-list-header);
            border-bottom: 1px solid var(--border-light);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transition: background 0.25s, border-color 0.25s, color 0.25s;
        }

        .file-list .list-header .col-name {
            padding-left: 2rem;
        }

        .file-list .list-item {
            display: grid;
            grid-template-columns: 3fr 1.2fr 1.4fr 0.6fr;
            align-items: center;
            padding: 0.5rem 1.5rem;
            border-bottom: 1px solid var(--border-light);
            transition: background 0.12s, border-color 0.25s;
            cursor: default;
        }

        .file-list .list-item:last-child {
            border-bottom: none;
        }

        .file-list .list-item:hover {
            background: var(--bg-item-hover);
        }

        .file-list .list-item .col-name {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            overflow: hidden;
        }

        .file-list .list-item .col-name .icon {
            font-size: 1.3rem;
            line-height: 1;
            flex-shrink: 0;
            width: 1.6rem;
            text-align: center;
        }

        .file-list .list-item .col-name .name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.25s;
        }

        .file-list .list-item .col-name .name a {
            color: inherit;
            text-decoration: none;
        }

        .file-list .list-item .col-name .name a:hover {
            color: var(--color-primary);
            text-decoration: underline;
        }

        .file-list .list-item .col-name .name.dir-name {
            cursor: pointer;
        }

        .file-list .list-item .col-name .name.dir-name:hover {
            color: var(--color-primary);
        }

        .file-list .list-item .col-size {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .file-list .list-item .col-time {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .file-list .list-item .col-action {
            display: flex;
            justify-content: flex-end;
            gap: 0.4rem;
        }

        .file-list .list-item .col-action .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.12s;
            text-decoration: none;
        }

        .file-list .list-item .col-action .action-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .file-list .list-item .col-action .action-btn.view-btn {
            color: var(--color-primary);
        }

        .file-list .list-item .col-action .action-btn.view-btn:hover {
            background: var(--color-primary-bg);
            border-color: var(--color-primary-border);
        }

        .file-list .list-item.is-dir .col-name .name {
            font-weight: 600;
        }

        .file-list .list-item.is-dir .col-name .name::after {
            content: "/";
            color: var(--text-light);
            font-weight: 300;
            margin-left: 0.15rem;
        }

        .footer {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-light);
            padding: 0 0.5rem;
            transition: color 0.25s;
        }

        .footer .stats {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .footer .stats span {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .footer .stats .num {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .footer .powered {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .footer .powered a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s;
        }

        .footer .powered a:hover {
            color: var(--color-primary);
        }

        .theme-toggle {
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 0.2rem 0.5rem;
            font-size: 1.1rem;
            line-height: 1.4;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.2rem;
            color: var(--text-secondary);
        }

        .theme-toggle:hover {
            background: var(--bg-item-hover);
            border-color: var(--text-light);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 820px) {
            .file-list .list-header {
                grid-template-columns: 2.5fr 1.2fr 1fr 0.5fr;
                padding: 0.5rem 1rem;
                font-size: 0.65rem;
            }
            .file-list .list-item {
                grid-template-columns: 2.5fr 1.2fr 1fr 0.5fr;
                padding: 0.5rem 1rem;
            }
            .file-list .list-item .col-name .icon {
                font-size: 1.1rem;
                width: 1.4rem;
            }
            .file-list .list-item .col-name .name {
                font-size: 0.82rem;
            }
            .file-list .list-item .col-size {
                font-size: 0.75rem;
            }
            .file-list .list-item .col-time {
                font-size: 0.7rem;
            }
            .header {
                padding: 1rem 1.2rem;
            }
            .header-left .repo-name {
                font-size: 1rem;
                padding: 0.15rem 0.6rem;
            }
            .header-left .path-breadcrumb {
                font-size: 0.82rem;
            }
            .config-panel {
                padding: 1rem 1.2rem;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 0.8rem 0.6rem;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.6rem;
                padding: 0.8rem 1rem;
            }
            .header-left {
                flex-wrap: wrap;
                gap: 0.4rem;
            }
            .header-right {
                justify-content: flex-start;
                flex-wrap: wrap;
                gap: 0.4rem;
            }
            .file-list .list-header {
                display: none;
            }
            .file-list .list-item {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                padding: 0.6rem 1rem;
                gap: 0.2rem 0.6rem;
                border-bottom: 1px solid var(--border-light);
            }
            .file-list .list-item .col-name {
                flex: 1 1 100%;
                gap: 0.5rem;
            }
            .file-list .list-item .col-size {
                flex: 0 1 auto;
                font-size: 0.75rem;
                color: var(--text-muted);
                padding-left: 2.1rem;
            }
            .file-list .list-item .col-time {
                flex: 0 1 auto;
                font-size: 0.7rem;
                color: var(--text-light);
            }
            .file-list .list-item .col-action {
                flex: 0 1 auto;
                margin-left: auto;
            }
            .file-list .list-item .col-name .icon {
                font-size: 1.1rem;
                width: 1.3rem;
            }
            .file-list .list-item .col-name .name {
                font-size: 0.85rem;
            }
            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
                font-size: 0.72rem;
                padding: 0.5rem 0;
            }
            .config-panel .form-row {
                flex-direction: column;
                align-items: stretch;
            }
            .config-panel .form-row input {
                flex: 1 1 auto;
            }
            .config-panel .form-row .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 400px) {
            .header-left .repo-name {
                font-size: 0.85rem;
            }
            .header-left .path-breadcrumb {
                font-size: 0.72rem;
            }
            .file-list .list-item {
                padding: 0.5rem 0.6rem;
            }
            .file-list .list-item .col-name .name {
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <header class="header" id="appHeader">
        <div class="header-left">
            <span class="repo-icon">📦</span>
            <span class="repo-name" id="repoNameDisplay">
                <a href="#" target="_blank" id="repoLink">owner/repo</a>
            </span>
            <div class="path-breadcrumb" id="breadcrumb"></div>
        </div>
        <div class="header-right">
            <span class="token-indicator" id="tokenIndicator">
                <span class="dot off" id="tokenDot"></span>
                <span id="tokenLabel">公开</span>
            </span>
            <button class="theme-toggle" id="themeToggle" title="切换暗色/亮色模式">🌙</button>
            <button class="btn" id="btnConfig" title="配置仓库和 Token">⚙️ 配置</button>
            <button class="btn btn-primary" id="btnRefresh">🔄 刷新</button>
        </div>
    </header>

    <div class="config-panel" id="configPanel">
        <h3>🔧 仓库配置</h3>
        <div class="form-row">
            <label for="inputOwner">Owner</label>
            <input type="text" id="inputOwner" placeholder="例如: github用户名" />
            <label for="inputRepo">Repo</label>
            <input type="text" id="inputRepo" placeholder="例如: 仓库名" />
            <label for="inputToken">Token (可选)</label>
            <input type="password" id="inputToken" placeholder="ghp_xxxxxxxx" />
            <button class="btn btn-primary" id="btnSaveConfig">✓ 保存</button>
            <button class="btn btn-secondary" id="btnCancelConfig">取消</button>
        </div>
        <div class="hint">
            💡 Token 仅用于访问<strong>私有仓库</strong>，公共仓库无需填写。
            从 <a href="https://github.com/settings/tokens" target="_blank">GitHub Settings</a> 生成，
            权限勾选 <code>repo</code> 或 <code>public_repo</code>。
        </div>
    </div>

    <div class="content" id="contentArea">
        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <div class="text">正在加载 <strong id="loadingPath">/</strong> …</div>
        </div>
    </div>

    <footer class="footer">
        <div class="stats" id="statsArea">
            <span>📄 文件 <span class="num" id="fileCount">-</span></span>
            <span>📁 文件夹 <span class="num" id="dirCount">-</span></span>
            <span>📦 总计 <span class="num" id="totalCount">-</span></span>
        </div>
        <div class="powered">
            <span>⚡ 通过 GitHub API</span>
            <span>·</span>
            <a href="#" id="githubRepoLink" target="_blank">在 GitHub 上查看</a>
        </div>
    </footer>
</div>

<script>
    (function() {
        'use strict';

        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const repoNameDisplay = $('#repoNameDisplay');
        const repoLink = $('#repoLink');
        const breadcrumb = $('#breadcrumb');
        const contentArea = $('#contentArea');
        const loadingPath = $('#loadingPath');
        const fileCount = $('#fileCount');
        const dirCount = $('#dirCount');
        const totalCount = $('#totalCount');
        const githubRepoLink = $('#githubRepoLink');
        const btnRefresh = $('#btnRefresh');
        const btnConfig = $('#btnConfig');
        const configPanel = $('#configPanel');
        const inputOwner = $('#inputOwner');
        const inputRepo = $('#inputRepo');
        const inputToken = $('#inputToken');
        const btnSaveConfig = $('#btnSaveConfig');
        const btnCancelConfig = $('#btnCancelConfig');
        const tokenIndicator = $('#tokenIndicator');
        const tokenDot = $('#tokenDot');
        const tokenLabel = $('#tokenLabel');
        const themeToggle = $('#themeToggle');

        let state = {
            owner: '',
            repo: '',
            token: '',
            currentPath: '',      // 相对于仓库根的路径，空字符串表示根目录
            entries: [],
            isLoading: false,
            isConfigVisible: false,
            theme: 'light',
        };

        // ===== 主题 =====
        function setTheme(theme) {
            state.theme = theme;
            if (theme === 'dark') {
                document.body.classList.add('dark');
                themeToggle.textContent = '☀️';
            } else {
                document.body.classList.remove('dark');
                themeToggle.textContent = '🌙';
            }
            try { localStorage.setItem('fileIndexTheme', theme); } catch (_) {}
        }

        function loadTheme() {
            try {
                const saved = localStorage.getItem('fileIndexTheme');
                if (saved === 'dark' || saved === 'light') {
                    setTheme(saved);
                    return;
                }
            } catch (_) {}
            setTheme('light');
        }

        function toggleTheme() {
            setTheme(state.theme === 'light' ? 'dark' : 'light');
        }

        // ===== 工具 =====
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            const val = (bytes / Math.pow(k, i)).toFixed(i > 0 ? 1 : 0);
            return val + ' ' + sizes[i];
        }

        function getFileIcon(name, type) {
            if (type === 'dir') return '📁';
            const ext = name.split('.').pop().toLowerCase();
            const map = {
                'md': '📝', 'txt': '📄', 'json': '📋', 'js': '🟨', 'ts': '🟦',
                'jsx': '⚛️', 'tsx': '⚛️', 'html': '🌐', 'css': '🎨', 'scss': '🎨',
                'less': '🎨', 'py': '🐍', 'java': '☕', 'c': '⚙️', 'cpp': '⚙️',
                'h': '⚙️', 'go': '🐹', 'rs': '🦀', 'rb': '💎', 'php': '🐘',
                'swift': '🦅', 'kt': '🎯', 'vue': '🟩', 'svelte': '🟧',
                'sh': '💻', 'bash': '💻', 'yml': '📜', 'yaml': '📜', 'toml': '📜',
                'xml': '📜', 'svg': '🖼️', 'png': '🖼️', 'jpg': '🖼️', 'jpeg': '🖼️',
                'gif': '🖼️', 'webp': '🖼️', 'ico': '🖼️', 'pdf': '📕',
                'zip': '📦', 'tar': '📦', 'gz': '📦', '7z': '📦', 'rar': '📦',
                'exe': '⚡', 'dmg': '💿', 'apk': '📱', 'ipa': '📱',
                'deb': '📦', 'rpm': '📦', 'mp4': '🎬', 'mov': '🎬', 'avi': '🎬',
                'mkv': '🎬', 'mp3': '🎵', 'wav': '🎵', 'flac': '🎵', 'aac': '🎵',
                'ogg': '🎵', 'wma': '🎵',
            };
            return map[ext] || '📄';
        }

        // ===== 从 URL 解析 owner/repo =====
        function parseOwnerRepoFromURL() {
            const url = window.location.href;
            try {
                const u = new URL(url);
                const host = u.hostname;
                const path = u.pathname.replace(/\/$/, '');
                if (host.endsWith('.github.io')) {
                    const parts = host.split('.');
                    const owner = parts[0];
                    const pathSegments = path.split('/').filter(Boolean);
                    if (pathSegments.length >= 1) {
                        const repo = pathSegments[0];
                        return { owner, repo };
                    }
                    return null;
                }
                return null;
            } catch (_) {
                return null;
            }
        }

        // ===== 从 localStorage 加载配置 =====
        function loadConfigFromStorage() {
            try {
                const raw = localStorage.getItem('fileIndexConfig');
                if (raw) {
                    const cfg = JSON.parse(raw);
                    if (cfg.owner && cfg.repo) {
                        state.owner = cfg.owner;
                        state.repo = cfg.repo;
                        state.token = cfg.token || '';
                        return true;
                    }
                }
            } catch (_) {}
            return false;
        }

        function saveConfigToStorage(owner, repo, token) {
            try {
                localStorage.setItem('fileIndexConfig', JSON.stringify({ owner, repo, token: token || '' }));
            } catch (_) {}
        }

        // ===== 更新 UI =====
        function updateRepoUI() {
            const display = state.owner && state.repo ? `${state.owner}/${state.repo}` : '未配置';
            repoNameDisplay.textContent = display;
            if (state.owner && state.repo) {
                repoLink.href = `https://github.com/${state.owner}/${state.repo}`;
                repoLink.textContent = display;
                githubRepoLink.href = `https://github.com/${state.owner}/${state.repo}`;
                githubRepoLink.textContent = `github.com/${state.owner}/${state.repo}`;
            } else {
                repoLink.href = '#';
                repoLink.textContent = '请配置仓库';
                githubRepoLink.href = '#';
                githubRepoLink.textContent = '请配置仓库';
            }

            if (state.token) {
                tokenDot.className = 'dot on';
                tokenLabel.textContent = 'Token ✓';
            } else {
                tokenDot.className = 'dot off';
                tokenLabel.textContent = '公开';
            }

            inputOwner.value = state.owner || '';
            inputRepo.value = state.repo || '';
            inputToken.value = state.token || '';
        }

        // ===== 面包屑 =====
        function updateBreadcrumb(path) {
            const parts = path.split('/').filter(Boolean);
            let html = '';
            if (parts.length === 0) {
                html = `<span class="crumb current" data-path="">/</span>`;
            } else {
                html = `<span class="crumb" data-path="">/</span>`;
                let cumPath = '';
                for (let i = 0; i < parts.length; i++) {
                    const p = parts[i];
                    cumPath += (i === 0 ? '' : '/') + p;
                    const isLast = i === parts.length - 1;
                    html += `<span class="sep"> / </span>`;
                    html += `<span class="crumb ${isLast ? 'current' : ''}" data-path="${cumPath}">${p}</span>`;
                }
            }
            breadcrumb.innerHTML = html;

            breadcrumb.querySelectorAll('.crumb:not(.current)').forEach(el => {
                el.addEventListener('click', function(e) {
                    const path = this.dataset.path;
                    if (path !== undefined) {
                        navigateTo(path);
                    }
                });
            });
        }

        // ===== 导航 =====
        function navigateTo(path) {
            if (state.isLoading) return;
            state.currentPath = path;
            updateBreadcrumb(path);
            loadDirectory(path);
            try {
                history.pushState(null, '', '?path=' + encodeURIComponent(path));
            } catch (_) {}
        }

        // ===== 加载目录 =====
        async function loadDirectory(path) {
            if (!state.owner || !state.repo) {
                showConfigRequired();
                return;
            }

            state.isLoading = true;
            showLoading(path);

            try {
                const apiPath = path || '';
                const url = `https://api.github.com/repos/${state.owner}/${state.repo}/contents${apiPath ? '/' + encodeURIComponent(apiPath) : ''}`;
                const headers = {
                    'Accept': 'application/vnd.github.v3+json',
                };
                if (state.token) {
                    headers['Authorization'] = `token ${state.token}`;
                }

                const resp = await fetch(url, { headers });
                if (!resp.ok) {
                    if (resp.status === 404) {
                        throw new Error(`目录 "${apiPath || '/'}" 不存在`);
                    } else if (resp.status === 401 || resp.status === 403) {
                        throw new Error(`认证失败，请检查 Token 是否有效且具有相应权限`);
                    } else {
                        throw new Error(`请求失败 (HTTP ${resp.status})`);
                    }
                }

                const data = await resp.json();
                if (!Array.isArray(data)) {
                    throw new Error('响应数据格式异常');
                }

                state.entries = data;
                renderEntries(data, path);

            } catch (err) {
                showError(err.message);
            } finally {
                state.isLoading = false;
            }
        }

        // ===== 渲染 =====
        function renderEntries(entries, currentPath) {
            const dirs = entries.filter(e => e.type === 'dir').sort((a, b) => a.name.localeCompare(b.name));
            const files = entries.filter(e => e.type === 'file').sort((a, b) => a.name.localeCompare(b.name));

            fileCount.textContent = files.length;
            dirCount.textContent = dirs.length;
            totalCount.textContent = entries.length;

            if (entries.length === 0) {
                showEmpty(currentPath);
                return;
            }

            let html = `<div class="file-list">`;
            html += `
                <div class="list-header">
                    <span class="col-name">名称</span>
                    <span class="col-size">大小</span>
                    <span class="col-time">更新 (SHA)</span>
                    <span class="col-action">操作</span>
                </div>
            `;

            for (const dir of dirs) {
                html += renderItem(dir, currentPath, true);
            }
            for (const file of files) {
                html += renderItem(file, currentPath, false);
            }

            html += `</div>`;
            contentArea.innerHTML = html;

            contentArea.querySelectorAll('.dir-name[data-path]').forEach(el => {
                el.addEventListener('click', function(e) {
                    const path = this.dataset.path;
                    if (path) {
                        navigateTo(path);
                    }
                });
            });

            contentArea.querySelectorAll('.view-btn[data-url]').forEach(el => {
                el.addEventListener('click', function(e) {
                    const url = this.dataset.url;
                    if (url) {
                        window.open(url, '_blank');
                    }
                });
            });
        }

        function renderItem(item, currentPath, isDir) {
            const fullPath = currentPath ? currentPath + '/' + item.name : item.name;
            const icon = isDir ? '📁' : getFileIcon(item.name, 'file');
            const sizeStr = isDir ? '—' : formatSize(item.size);
            const timeDisplay = isDir ? '-' : (item.sha ? item.sha.substring(0, 7) : '-');

            const nameClass = isDir ? 'name dir-name' : 'name';
            const nameContent = isDir ?
                `<span class="${nameClass}" data-path="${fullPath}">${item.name}</span>` :
                `<span class="${nameClass}">${item.name}</span>`;

            const viewUrl = `https://github.com/${state.owner}/${state.repo}/blob/main/${encodeURIComponent(fullPath)}`;
            const actionHtml = isDir ?
                `<span style="font-size:0.7rem;color:var(--text-light);">📂</span>` :
                `<a class="action-btn view-btn" data-url="${viewUrl}" target="_blank" title="在 GitHub 上查看">👁️</a>`;

            return `
                <div class="list-item ${isDir ? 'is-dir' : ''}">
                    <div class="col-name">
                        <span class="icon">${icon}</span>
                        ${nameContent}
                    </div>
                    <div class="col-size">${sizeStr}</div>
                    <div class="col-time">${timeDisplay}</div>
                    <div class="col-action">${actionHtml}</div>
                </div>
            `;
        }

        // ===== UI 状态 =====
        function showLoading(path) {
            const displayPath = path || '/';
            contentArea.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <div class="text">正在加载 <strong>${displayPath}</strong> …</div>
                </div>
            `;
            fileCount.textContent = '…';
            dirCount.textContent = '…';
            totalCount.textContent = '…';
        }

        function showEmpty(path) {
            const displayPath = path || '/';
            contentArea.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <div class="title">目录为空</div>
                    <div class="desc">"${displayPath}" 中没有文件或子文件夹</div>
                </div>
            `;
            fileCount.textContent = '0';
            dirCount.textContent = '0';
            totalCount.textContent = '0';
        }

        function showError(msg) {
            contentArea.innerHTML = `
                <div class="error-state">
                    <div class="icon">⚠️</div>
                    <div class="title">加载失败</div>
                    <div class="desc">${msg}</div>
                    <button class="btn" onclick="window.location.reload()">🔄 重试</button>
                </div>
            `;
            fileCount.textContent = '-';
            dirCount.textContent = '-';
            totalCount.textContent = '-';
        }

        function showConfigRequired() {
            contentArea.innerHTML = `
                <div class="error-state">
                    <div class="icon">🔧</div>
                    <div class="title">请配置仓库</div>
                    <div class="desc">点击右上角「配置」按钮，填写 Owner 和 Repo 名称。</div>
                </div>
            `;
            fileCount.textContent = '-';
            dirCount.textContent = '-';
            totalCount.textContent = '-';
        }

        // ===== 配置面板 =====
        function toggleConfig(show) {
            const vis = (show !== undefined) ? show : !state.isConfigVisible;
            state.isConfigVisible = vis;
            configPanel.classList.toggle('visible', vis);
            if (vis) {
                inputOwner.value = state.owner || '';
                inputRepo.value = state.repo || '';
                inputToken.value = state.token || '';
                inputOwner.focus();
            }
        }

        function saveConfig() {
            const owner = inputOwner.value.trim();
            const repo = inputRepo.value.trim();
            const token = inputToken.value.trim();

            if (!owner || !repo) {
                alert('请填写 Owner 和 Repo 名称');
                return;
            }

            state.owner = owner;
            state.repo = repo;
            state.token = token;
            saveConfigToStorage(owner, repo, token);
            updateRepoUI();
            toggleConfig(false);
            // 重新加载当前路径
            loadDirectory(state.currentPath);
        }

        // ===== 初始化 =====
        function init() {
            loadTheme();

            // 1. 尝试从 URL 解析 owner/repo
            const parsed = parseOwnerRepoFromURL();
            if (parsed) {
                state.owner = parsed.owner;
                state.repo = parsed.repo;
                state.token = '';
                saveConfigToStorage(parsed.owner, parsed.repo, '');
            }

            // 2. 从 localStorage 覆盖
            const hasStorage = loadConfigFromStorage();

            updateRepoUI();

            // 3. 计算当前 HTML 所在目录（相对于仓库根）
            let detectedPath = '';
            if (state.owner && state.repo) {
                const pathname = window.location.pathname;
                let p = pathname.replace(/^\//, '');
                // 移除仓库名前缀
                if (p.startsWith(state.repo + '/')) {
                    p = p.substring(state.repo.length + 1);
                } else if (p === state.repo) {
                    p = '';
                }
                // 移除文件名（如果存在）
                const lastSlash = p.lastIndexOf('/');
                const lastPart = p.substring(lastSlash + 1);
                if (lastPart.includes('.')) {
                    p = p.substring(0, lastSlash);
                }
                // 去掉末尾多余的斜杠
                if (p.endsWith('/')) p = p.slice(0, -1);
                detectedPath = p;
            }

            // 4. URL 参数 ?path 覆盖
            const params = new URLSearchParams(window.location.search);
            const pathParam = params.get('path');
            if (pathParam !== null) {
                state.currentPath = pathParam;
            } else {
                state.currentPath = detectedPath;
            }

            updateBreadcrumb(state.currentPath);

            if (state.owner && state.repo) {
                loadDirectory(state.currentPath);
            } else {
                showConfigRequired();
                setTimeout(() => toggleConfig(true), 300);
            }

            // 5. 事件绑定
            btnRefresh.addEventListener('click', function() {
                if (state.owner && state.repo) {
                    loadDirectory(state.currentPath);
                } else {
                    toggleConfig(true);
                }
            });

            btnConfig.addEventListener('click', function() {
                toggleConfig();
            });

            btnSaveConfig.addEventListener('click', saveConfig);

            btnCancelConfig.addEventListener('click', function() {
                toggleConfig(false);
            });

            inputOwner.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveConfig(); });
            inputRepo.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveConfig(); });
            inputToken.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveConfig(); });

            themeToggle.addEventListener('click', toggleTheme);
        }

        document.addEventListener('DOMContentLoaded', init);
        window.navigateTo = navigateTo;

    })();
</script>

</body>
</html>
